<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>llama-webview</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">llama-webview</div>
      <div class="context-bar" id="context-bar">not connected</div>
      <button type="button" id="toggle-panel" class="icon-btn" title="Toggle panel">panel</button>
    </header>

    <main class="layout">
      <section class="chat-col">
        <div class="messages" id="messages"></div>
        <form class="composer" id="composer">
          <textarea
            id="composer-input"
            rows="1"
            placeholder="Message… (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <button type="submit" id="send-btn">Send</button>
          <button type="button" id="stop-btn" hidden>Stop</button>
        </form>
      </section>

      <aside class="side-panel" id="side-panel">
        <section class="panel-section">
          <h2>Models directory</h2>
          <div class="row">
            <button type="button" id="btn-pick-dir">Pick directory&hellip;</button>
            <button type="button" id="btn-refresh-models">Refresh</button>
          </div>
          <div id="models-dir-label" class="dim">(not picked yet)</div>
          <ul id="model-list"></ul>
        </section>

        <section class="panel-section">
          <h2>Server</h2>
          <label>model path
            <input id="model-path" type="text" placeholder="/storage/emulated/0/Models/model.gguf" />
          </label>
          <div class="row">
            <label>port
              <input id="port" type="number" value="8080" />
            </label>
            <label>ctx size
              <input id="ctx-size" type="number" value="4096" />
            </label>
            <label>ngl
              <input id="ngl" type="number" value="99" />
            </label>
          </div>
          <div class="row">
            <button type="button" id="btn-start-server">Start</button>
            <button type="button" id="btn-stop-server">Stop</button>
          </div>
          <pre id="status">(not started)</pre>
          <details>
            <summary class="dim">Log tail</summary>
            <pre id="log"></pre>
          </details>
        </section>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
